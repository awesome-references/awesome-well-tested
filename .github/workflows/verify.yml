name: verify

on:
  # Run by hand to verify submissions, or with no input to recheck the whole list.
  workflow_dispatch:
    inputs:
      repos:
        description: 'Repositories to verify, space separated (owner/repo). Empty rechecks every listed entry.'
        required: false
        default: ''
      open_pr:
        description: 'Open a pull request with the refreshed reports'
        type: boolean
        required: false
        default: true
  schedule:
    # Monday 04:17 UTC. The README promises periodic re-verification.
    - cron: '17 4 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    name: verify repositories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Verify
        id: verify
        # The built-in token lifts the API limit from 60 to 1000 requests per
        # hour, which is what makes verifying the whole list in one run possible.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOS: ${{ inputs.repos }}
        run: |
          set -o pipefail
          status=0
          if [ -n "$REPOS" ]; then
            for repo in $REPOS; do
              python scripts/verify_repo.py "$repo" | tee -a verify.log || status=$?
            done
          else
            python scripts/recheck_listed.py --fail-on-mismatch | tee verify.log || status=$?
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        if: always()
        run: |
          {
            echo '## Verification result'
            echo
            echo '```'
            tail -n 60 verify.log 2>/dev/null || echo 'No output captured.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Discard report changes that are only timestamps
        if: always()
        run: python scripts/prune_unchanged_reports.py

      - name: Open a pull request with the refreshed reports
        if: always() && (github.event_name == 'schedule' || inputs.open_pr)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain reports)" ]; then
            echo 'No report changes to commit.'
            exit 0
          fi
          branch="verify/reports-${{ github.run_id }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add reports
          git commit -m 'chore(reports): refresh verification reports'
          git push -u origin "$branch"
          gh pr create \
            --title 'chore(reports): refresh verification reports' \
            --body "Generated by the verify workflow (run ${{ github.run_id }}). Check the run summary for tier mismatches." \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch"

      - name: Fail if a listed entry no longer holds its tier
        if: always() && steps.verify.outputs.status != '0'
        run: |
          echo 'Verification reported a problem. See the job summary.' >&2
          exit 1
