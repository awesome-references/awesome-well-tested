name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  awesome-lint:
    name: awesome-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Run awesome-lint
        run: npx awesome-lint

  scripts:
    name: tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Byte-compile scripts
        run: python -m compileall -q scripts
      - name: Smoke-test the CLI help
        run: |
          python scripts/verify_repo.py --help
          python scripts/discover_candidates.py --help
          python scripts/recheck_listed.py --help
          python scripts/prune_unchanged_reports.py --help
      - name: Check that every listed entry parses
        run: python scripts/recheck_listed.py --dry-run

      - name: Install coverage
        run: pip install --quiet coverage

      - name: Run the tests under coverage
        # fail_under is set to 80 in pyproject.toml: the same bar this list
        # applies to everything it recommends.
        run: |
          coverage run
          coverage report

      - name: Export lcov
        run: coverage lcov -o coverage.lcov

      - name: Publish the figure
        # Coveralls is what makes the number verifiable by this project's own
        # scripts. A list that will not publish its own coverage has no business
        # asking others to.
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.lcov
          format: lcov

  mutation:
    name: mutation testing
    # Slower than the rest, and its result is informational: this project holds
    # no mutation score it can prove to anyone else, so by its own rules it is
    # Silver, not Gold.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install mutmut
        run: pip install --quiet mutmut
      - name: Mutate the module that rewrites the list
        run: mutmut run || true
      - name: Show the results
        run: mutmut results || true
